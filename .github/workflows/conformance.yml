name: Trigger Protocol Conformance

on:
  push:
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install independent signature test dependency
        run: python -m pip install -r conformance/requirements.txt

      - name: Run independent signature vectors
        run: python conformance/test_signature_interop.py

      - name: Run protocol conformance tests
        run: python conformance/test_conformance.py

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run MCP proxy tests
        run: npm test
